services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoedit
      POSTGRES_PASSWORD: autoedit
      POSTGRES_DB: autoedit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoedit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autoedit:autoedit@postgres:5432/autoedit
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      ASSETS_DIR: /data/assets
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/data/storage
      - ./assets:/data/assets
      - ./services:/app/services
      - ./packages:/app/packages
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autoedit:autoedit@postgres:5432/autoedit
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      ASSETS_DIR: /data/assets
    volumes:
      - ./storage:/data/storage
      - ./assets:/data/assets
      - ./services:/app/services
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2} -Q celery

  youtube-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autoedit:autoedit@postgres:5432/autoedit
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      ASSETS_DIR: /data/assets
    volumes:
      - ./storage:/data/storage
      - ./assets:/data/assets
      - ./services:/app/services
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=1 -Q youtube

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_NAME: AutoEdit AI
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
