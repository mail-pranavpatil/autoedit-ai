# Render Blueprint — AutoEdit AI (split API/worker, R2 object storage).
#
# Review it in Render's Blueprint preview before "Apply". Three services:
#   autoedit-api     — FastAPI only. No disk; media reads/writes go through
#                      services/autoedit/object_storage.py to R2 (or presign
#                      redirects). DB schema/migrations now live in Supabase
#                      (supabase/migrations, applied via `supabase db push`),
#                      not run as part of deploy.
#   autoedit-worker  — Celery worker only (process_video/render_video/youtube
#                      publish). Sized independently of the API so a big
#                      source video's render can't take the API down with it.
#                      No disk either - local /data/storage is now a pure
#                      ephemeral L1 cache; R2 is the durable copy.
#   autoedit-web     — Next.js. Proxies /api/* and /health to autoedit-api so
#                      the browser only ever talks to one origin (same-site
#                      cookie).
#
# Previously this was two services (autoedit combined API+worker, autoedit-web)
# sharing one Render Disk - see git history / RENDER_DEPLOYMENT.md for why,
# and why that stopped being enough once source videos hit 400-600MB.
#
# Postgres is Supabase-hosted now (not a Render managed database) — DATABASE_URL
# below is a plain secret set in the dashboard. Redis is still Render-managed.
# If Render's validator rejects `type: redis`, rename it to `type: keyvalue`
# (same thing, newer name).
#
# The `sync: false` vars have no value here on purpose — set them in the Render
# dashboard after the first deploy (secrets + the two URLs you only learn once
# the web service exists), plus the new R2 credentials below. See
# RENDER_DEPLOYMENT.md.

services:
  - type: redis
    name: autoedit-redis
    plan: free
    ipAllowList: []        # internal only
    maxmemoryPolicy: noeviction   # Celery broker must not evict

  - type: web
    name: autoedit-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STORAGE_DIR
        value: /data/storage   # ephemeral scratch only now (asset-upload temp files) - no disk attached
      - key: ASSETS_DIR
        value: /data/assets
      - key: IOS_REDIRECT_SCHEME
        value: autoedit
      - key: REDIS_URL     # needed for celery_app.control.revoke (cancel endpoints)
        fromService:
          type: redis
          name: autoedit-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: r2
      # --- set these in the dashboard after the first deploy ---
      - key: DATABASE_URL           # Supabase Postgres connection string (pooler)
        sync: false
      - key: SUPABASE_URL           # https://<project-ref>.supabase.co - also used to
        sync: false                # build the JWKS URL that verifies auth tokens, see auth.py
      - key: FRONTEND_URL          # https://<your autoedit-web URL>
        sync: false
      - key: GOOGLE_REDIRECT_URI   # https://<your autoedit-api URL>/api/channels/youtube/callback
        sync: false
      - key: TOKEN_ENCRYPTION_KEY  # 44-char urlsafe base64 Fernet key
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT            # https://<account id>.r2.cloudflarestorage.com
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: autoedit-worker
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.worker
    dockerContext: .
    plan: standard          # 1 CPU / 2GB - bump/shrink using the RSS-per-stage
                             # worker logs (pipeline._set_status) to size it for real
    # Render's dockerCommand is NOT run through a shell - bash's ${VAR:-default}
    # fallback syntax doesn't expand, it's passed through literally and breaks
    # celery's arg parsing. WORKER_CONCURRENCY is always set below, so plain
    # ${VAR} substitution (which Render does support) is enough.
    dockerCommand: "celery -A worker.celery_app worker --loglevel=info -Q celery,youtube --concurrency=${WORKER_CONCURRENCY}"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STORAGE_DIR
        value: /data/storage   # ephemeral L1 cache only now - R2 is the durable copy
      - key: ASSETS_DIR
        value: /data/assets
      - key: WORKER_CONCURRENCY
        value: "1"             # one render at a time; raise only with a bigger plan
      - key: RENDER_FFMPEG_THREADS
        value: "1"
      - key: DATABASE_URL            # same Supabase connection string as autoedit-api
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: autoedit-redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: r2
      # --- set these in the dashboard after the first deploy ---
      - key: TOKEN_ENCRYPTION_KEY   # same value as autoedit-api - decrypts Drive OAuth tokens
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # --- optional, have sane defaults in config.py ---
      - key: APIFY_IMAGE_ACTOR
        value: hooli~google-images-scraper
      - key: ENABLE_DENSE_BROLL
        value: "true"
      - key: BROLL_QUERY_MODEL
        value: gpt-4o
      - key: LLM_MODEL
        value: gpt-4o-mini

  - type: web
    name: autoedit-web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.web
    dockerContext: .
    plan: starter
    healthCheckPath: /login    # self-contained 200 (doesn't depend on the API being up)
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: ""                # same-origin; baked at build time
      - key: API_PROXY_ORIGIN    # internal host:port of the API service
        fromService:
          type: web
          name: autoedit-api
          property: hostport
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
