# Render Blueprint — AutoEdit AI (single-origin, combined API+worker).
#
# Review it in Render's Blueprint preview before "Apply". Two services:
#   autoedit      — FastAPI + Celery worker in ONE container (shared filesystem;
#                   see docker/start-combined.sh). Owns the persistent disk.
#   autoedit-web  — Next.js. Proxies /api/* and /health to `autoedit` so the
#                   browser only ever talks to one origin (same-site cookie).
#
# Managed Postgres + Redis are declared below. If Render's validator rejects
# `type: redis`, rename it to `type: keyvalue` (same thing, newer name).
#
# The `sync: false` vars have no value here on purpose — set them in the Render
# dashboard after the first deploy (secrets + the two URLs you only learn once
# the web service exists). See RENDER_DEPLOYMENT.md.

databases:
  - name: autoedit-db
    databaseName: autoedit
    user: autoedit
    plan: free            # free Postgres is deleted after 30 days — upgrade for anything real

services:
  - type: redis
    name: autoedit-redis
    plan: free
    ipAllowList: []        # internal only
    maxmemoryPolicy: noeviction   # Celery broker must not evict

  - type: web
    name: autoedit
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    plan: starter          # a persistent disk requires a paid instance
    healthCheckPath: /health
    preDeployCommand: "alembic upgrade head"
    dockerCommand: "bash /app/start-combined.sh"   # docker runtime uses dockerCommand, not startCommand
    disk:
      name: autoedit-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STORAGE_DIR
        value: /data/storage
      - key: ASSETS_DIR
        value: /data/assets
      - key: WORKER_CONCURRENCY
        value: "1"           # starter plan ≈ 512 MB; 1 render at a time prevents OOM SIGKILL 9
      - key: RENDER_FFMPEG_THREADS
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: IOS_REDIRECT_SCHEME
        value: autoedit
      - key: DATABASE_URL
        fromDatabase:
          name: autoedit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: autoedit-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # --- set these in the dashboard after the first deploy ---
      - key: FRONTEND_URL          # https://<your autoedit-web URL>
        sync: false
      - key: GOOGLE_REDIRECT_URI   # https://<your autoedit-web URL>/api/auth/callback
        sync: false
      - key: TOKEN_ENCRYPTION_KEY  # 44-char urlsafe base64 Fernet key
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      # --- optional, have sane defaults in config.py ---
      - key: APIFY_IMAGE_ACTOR
        value: hooli~google-images-scraper
      - key: ENABLE_DENSE_BROLL
        value: "true"
      - key: BROLL_QUERY_MODEL
        value: gpt-4o
      - key: LLM_MODEL
        value: gpt-4o-mini

  - type: web
    name: autoedit-web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.web
    dockerContext: .
    plan: starter
    healthCheckPath: /login    # self-contained 200 (doesn't depend on the API being up)
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: ""                # same-origin; baked at build time
      - key: API_PROXY_ORIGIN    # internal host:port of the combined service
        fromService:
          type: web
          name: autoedit
          property: hostport
