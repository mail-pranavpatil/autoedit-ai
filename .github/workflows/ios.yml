name: Build iOS

# Compile-check the Flutter WebView shell on a macOS runner (the dev machine
# is Windows). Unsigned build - proves it compiles; producing an installable
# IPA needs signing secrets (see apps/mobile/README.md).

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compile (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v4
        with:
          name: AutoEditAI-unsigned-app
          path: apps/mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error
